name: CI

# Proves a commit is sound: lint, types, a trained model that clears the quality gate,
# and an image that builds and serves that model. It never pushes and never deploys —
# releasing is cd.yml, triggered by a `v*` tag.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, train, quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check tickets tests scripts

      - name: Type check
        run: mypy tickets scripts

      # Trained exactly once per run. The artifacts this step writes are the ones the
      # gate validates and the ones the image is built around — no second training run
      # anywhere in the pipeline, so the tested model is the shipped model.
      - name: Train model
        run: python -m tickets.train

      # The quality gate. If held-out macro F1, accuracy or any per-class F1 falls below the
      # thresholds in tickets/config.py, this step fails and nothing ships.
      - name: Model quality gate
        run: pytest tests/test_model_quality.py -v

      - name: Data, text, API and drift tests
        run: pytest tests/test_data.py tests/test_text.py tests/test_api.py tests/test_monitoring.py -v

      - name: Publish metrics to the job summary
        if: always()
        run: |
          {
            echo '### Model metrics'
            echo '```json'
            cat artifacts/metrics.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `always()`, so this may hold a model that FAILED the gate — it is for inspecting
      # a red build, never for releasing. The releasable artifact is CD's
      # `release-artifacts`, which is uploaded only on success. Do not consume this one
      # from another workflow.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-artifacts-unverified
          path: artifacts/
          retention-days: 7

  build:
    name: Build image
    runs-on: ubuntu-latest
    # Only runs if the gate passed: a failing model never becomes an image.
    needs: test
    steps:
      - uses: actions/checkout@v4

      # The gated model, not a fresh one. The Dockerfile COPYs artifacts/ instead of
      # training, so this download is what gets baked into the image.
      - uses: actions/download-artifact@v4
        with:
          name: ci-artifacts-unverified
          path: artifacts/

      - name: Build Docker image
        run: docker build -t ticket-router:${{ github.sha }} .

      # Shared with CD, so the two cannot drift: it asserts the image serves the exact
      # model version the gate signed off on, not merely that it serves *a* model.
      - name: Smoke test the image
        run: scripts/smoke_test.sh ticket-router:${{ github.sha }}
